# Bubblewrap Sandbox tmux configuration
set -g status-left-length 20
set -g status-left "#[fg=white,bg=purple,bold] BUBBLE #[default] "
set -g status-style bg=colour234,fg=colour137
set -g history-limit 50000

# Enhanced mouse scrolling & copy mode
set -g mouse on
set -s set-clipboard on
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -et='"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-emacs WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-emacs WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down

# Pane navigation using Alt + Arrow keys without prefix
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# WSL clipboard integration via clip.exe
if-shell 'test -n "$WSL_INTEROP" -a -x "/mnt/c/Windows/System32/clip.exe"' {
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
  bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
}
